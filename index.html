<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صناع الأثر | قسم المحاسبة 2027 – رسائل مجهولة</title>
<style>
:root{--bg:#f6f0fc;--card:#ffffff;--ink:#2a0a4a;--mute:#6f5a8c;--line:#e3d4f3;--acc:#7c3aed;--acc2:#a45de0;--acc-ink:#fff;--soft:#efe4fb;--warn:#b45309;--hero:#22033d;--hero-ink:#f5effc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150226;--card:#22033d;--ink:#f5effc;--mute:#b9a6d1;--line:#3d1a5e;--acc:#bb7deb;--acc2:#8b46d8;--acc-ink:#1a0230;--soft:#2e1050;--warn:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150226;--card:#22033d;--ink:#f5effc;--mute:#b9a6d1;--line:#3d1a5e;--acc:#bb7deb;--acc2:#8b46d8;--acc-ink:#1a0230;--soft:#2e1050;--warn:#fbbf24;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
.hero{background:radial-gradient(ellipse at 50% 0%,#3b0a66 0%,var(--hero) 60%);color:var(--hero-ink);text-align:center;padding:14px 16px 26px;border-radius:0 0 32px 32px}
.hero img{width:210px;max-width:60%;height:auto;display:block;margin:0 auto;-webkit-mask-image:radial-gradient(circle,#000 58%,transparent 71%);mask-image:radial-gradient(circle,#000 58%,transparent 71%)}
.hero h1{margin:0;font-size:30px;letter-spacing:.5px}
.hero .sub{color:#bb7deb;font-weight:700;margin-top:2px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.chip{background:rgba(187,125,235,.16);border:1px solid rgba(187,125,235,.4);color:#e9d5ff;padding:3px 14px;border-radius:99px;font-size:13px;font-weight:700}
.wrap{max-width:680px;margin:0 auto;padding:6px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px;box-shadow:0 6px 20px rgba(80,20,140,.07)}
label{display:block;font-size:13px;color:var(--mute);margin:0 0 4px;font-weight:700}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
textarea{min-height:100px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
.count{font-size:12px;color:var(--mute)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 20px;font-weight:700}
.primary{background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--acc-ink)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;color:var(--mute);padding:4px 10px;font-weight:600;font-size:13px}
.ghost:hover{color:var(--ink)}
.rules{background:var(--soft);border-radius:14px;padding:10px 14px;font-size:13px;margin-top:18px;border-right:4px solid var(--acc)}
.rules b{color:var(--acc)}
.msg{border-right:4px solid var(--acc)}
.msg .to{font-size:12px;color:var(--acc);font-weight:800}
.msg .txt{margin:4px 0 8px;white-space:pre-wrap;word-break:break-word;font-size:16px}
.msg .meta{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:12px;gap:8px;flex-wrap:wrap}
.acts{display:flex;gap:2px}
.liked{color:var(--acc)!important}
.note{text-align:center;color:var(--mute);padding:24px 8px;font-size:14px}
.warn{color:var(--warn);font-size:13px;margin-top:8px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
.bar h2{font-size:17px;margin:0}
.bar .c{color:var(--mute);font-size:13px}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:30px}
</style>
</head>

  <h1>صناع الأثر</h1>
  <div class="sub">قسم المحاسبة</div>
  <div class="chips"><span class="chip">🎓 دفعة تخرّج 2027</span><span class="chip">✉️ صندوق الرسائل المجهولة</span></div>
</header>

<div class="wrap">
  <div class="rules"><b>قواعد الصندوق:</b> نصنع الأثر بكلمة طيبة. لا شتائم ولا تنمّر ولا معلومات خاصة (أرقام هواتف أو عناوين). الرسالة التي يُبلَّغ عنها ٣ مرات تختفي تلقائياً.</div>

  <div class="card">
    <label for="to">إلى (اختياري)</label>
    <input id="to" maxlength="30" placeholder="اسم زميل/ة أو اتركه فارغاً ليكون للجميع">
    <div style="height:10px"></div>
    <label for="text">رسالتك</label>
    <textarea id="text" maxlength="500" placeholder="مثال: شكراً لأنك شرحت لي المحاسبة المتوسطة 🙏"></textarea>
    <div class="row">
      <span class="count"><span id="n">0</span> / 500</span>
      <button class="primary" id="send" disabled>إرسال مجهول</button>
    </div>
    <div class="warn" id="status" role="status"></div>
  </div>

  <div class="bar"><h2>أحدث الرسائل</h2><span class="c" id="total"></span></div>
  <div id="feed"><div class="note">جاري التحميل…</div></div>
  <footer>صناع الأثر · قسم المحاسبة · 2027</footer>
</div>

<script>
(function(){
  var feed=document.getElementById('feed'), text=document.getElementById('text'),
      to=document.getElementById('to'), send=document.getElementById('send'),
      n=document.getElementById('n'), status=document.getElementById('status'), total=document.getElementById('total');
  var API='/api/messages', sending=false, last=0, liked={}, reported={}, timer=null;
  var BAD=['كلب','حمار','غبي','حقير','زب','كس','شرموط','عاهر','قحب','منيك'];
  try{ liked=JSON.parse(localStorage.getItem('liked')||'{}'); reported=JSON.parse(localStorage.getItem('reported')||'{}'); }catch(e){}
  function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  function setStatus(t){ status.textContent=t||''; }
  function ago(ts){
    var s=Math.max(1,Math.floor((Date.now()-ts)/1000));
    if(s<60) return 'الآن';
    var m=Math.floor(s/60); if(m<60) return 'منذ '+m+' دقيقة';
    var h=Math.floor(m/60); if(h<24) return 'منذ '+h+' ساعة';
    return 'منذ '+Math.floor(h/24)+' يوم';
  }
  function clean(s){ return s.replace(/\s+/g,' ').trim(); }
  function hasBad(s){ return BAD.some(function(w){ return s.indexOf(w)!==-1; }); }
  function hasPhone(s){ return /(\+?\d[\d\s-]{7,})/.test(s); }
  function validate(){ n.textContent=text.value.length; send.disabled=sending||clean(text.value).length<3; }
  text.addEventListener('input',validate);
  function post(url,body){
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ if(!r.ok) throw new Error(d.error||''); return d; }); });
  }

  function render(list){
    feed.textContent=''; var shown=0;
    list.forEach(function(m){
      if((m.reports||0)>=3) return;
      shown++;
      var card=document.createElement('div'); card.className='card msg';
      var tt=document.createElement('div'); tt.className='to'; tt.textContent=m.to?'إلى: '+m.to:'للجميع';
      var tx=document.createElement('div'); tx.className='txt'; tx.textContent=String(m.text||'');
      var meta=document.createElement('div'); meta.className='meta';
      var when=document.createElement('span'); when.textContent=ago(m.createdAt||Date.now());
      var acts=document.createElement('div'); acts.className='acts';
      var like=document.createElement('button'); like.className='ghost'+(liked[m.id]?' liked':''); like.textContent='💜 '+(m.likes||0);
      like.onclick=function(){
        if(liked[m.id]) return; liked[m.id]=1; save('liked',liked);
        like.className='ghost liked'; like.textContent='💜 '+((m.likes||0)+1);
        post(API+'/'+m.id+'/like').then(load).catch(function(){ setStatus('تعذّر تسجيل الإعجاب'); });
      };
      var rep=document.createElement('button'); rep.className='ghost'; rep.textContent=reported[m.id]?'تم الإبلاغ':'🚩 إبلاغ'; rep.disabled=!!reported[m.id];
      rep.onclick=function(){
        if(reported[m.id]) return; reported[m.id]=1; save('reported',reported);
        rep.textContent='تم الإبلاغ'; rep.disabled=true;
        post(API+'/'+m.id+'/report').then(load).catch(function(){});
      };
      acts.appendChild(like); acts.appendChild(rep);
      meta.appendChild(when); meta.appendChild(acts);
      card.appendChild(tt); card.appendChild(tx); card.appendChild(meta); feed.appendChild(card);
    });
    total.textContent=shown?shown+' رسالة':'';
    if(!shown){ var e=document.createElement('div'); e.className='note'; e.textContent='لا توجد رسائل بعد. كن أول من يصنع الأثر 💌'; feed.appendChild(e); }
  }

  send.onclick=function(){
    var t=clean(text.value), r=clean(to.value);
    if(Date.now()-last<20000){ setStatus('انتظر قليلاً قبل إرسال رسالة أخرى.'); return; }
    if(hasBad(t)||hasBad(r)){ setStatus('الرسالة تحتوي ألفاظاً غير لائقة. عدّلها وحاول مجدداً.'); return; }
    if(hasPhone(t)){ setStatus('لا تضع أرقام هواتف أو معلومات شخصية في الرسالة.'); return; }
    sending=true; validate(); setStatus('جاري الإرسال…');
    post(API,{text:t,to:r})
      .then(function(){ last=Date.now(); text.value=''; to.value=''; setStatus('تم الإرسال بنجاح ✅'); load(); })
      .catch(function(e){ setStatus(e.message||'تعذّر الإرسال. حاول مجدداً.'); })
      .then(function(){ sending=false; validate(); });
  };
  function fail(msg){ feed.textContent=''; var e=document.createElement('div'); e.className='note'; e.textContent=msg; feed.appendChild(e); }
  var loaded=false;
  function load(){
    return fetch(API).then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(list){ loaded=true; render(list); })
      .catch(function(){ if(!loaded) fail('تعذّر تحميل الرسائل.'); });
  }
  validate(); load();
  timer=setInterval(function(){ if(!document.hidden) load(); },15000);
})();
</script>
</body>
</html>
