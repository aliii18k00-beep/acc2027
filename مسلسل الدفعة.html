<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لو الدفعة مسلسل | صناع الأثر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #1c0a40;
      --deep: #3b1584;
      --paper: #fbf9ff;
      --ink: #2a0f55;
      --line: #6d3fc4;
      --soft: #c9a8f5;
      --field: #f1e9ff;
      --danger: #d9304b;
      --success: #1a9d7b;
      color-scheme: light;
      box-sizing: border-box;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(160deg, var(--night), var(--deep) 60%, #6a35c9);
      color: var(--ink);
    }
    body {
      min-height: 100vh;
    }
    .view {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .view[hidden] { display: none; }
    .logo {
      display: block;
      width: min(260px, 64vw);
      height: auto;
      border-radius: 28px;
      background: rgba(255,255,255,.08);
      padding: 8px;
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }
    #welcome {
      flex-direction: column;
      text-align: center;
      gap: 18px;
      color: #fff;
    }
    #welcome h1 {
      margin: 8px 0 0;
      font-size: clamp(28px, 7vw, 44px);
      font-weight: 900;
    }
    #welcome p {
      margin: 0;
      color: var(--soft);
      font-size: 18px;
    }
    .start {
      display: flex;
      width: min(440px, 100%);
      gap: 10px;
      margin-top: 10px;
    }
    .start input {
      flex: 1;
      min-width: 0;
      font: inherit;
      font-size: 18px;
      padding: 14px 18px;
      border-radius: 999px;
      border: 2px solid var(--soft);
      background: #fff;
      color: var(--ink);
    }
    button {
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      border: 0;
      border-radius: 999px;
      padding: 14px 26px;
      background: #fff;
      color: var(--ink);
      font-size: 18px;
      transition: transform .15s ease, filter .15s ease;
    }
    button:hover { filter: brightness(0.98); }
    button:active { transform: translateY(1px); }
    :focus-visible {
      outline: 3px solid #ffd76a;
      outline-offset: 2px;
    }
    .err {
      color: #ffb3c1;
      min-height: 24px;
      font-size: 16px;
      font-weight: 700;
    }
    #formView {
      justify-content: flex-start;
      padding-top: 32px;
    }
    .paper {
      width: min(640px, 100%);
      background: var(--paper);
      border: 7px solid var(--line);
      border-radius: 70px 150px 70px 150px;
      padding: 34px 30px 40px;
      box-shadow: 0 0 0 6px rgba(255,255,255,.12), 0 30px 60px rgba(10,0,30,.5);
    }
    .paper .logo {
      width: 150px;
      margin: 0 auto;
      border-radius: 22px;
      background: rgba(29, 16, 62, 0.04);
    }
    .who {
      text-align: center;
      margin: 14px 0 4px;
      font-weight: 700;
      font-size: 18px;
    }
    .who b { font-weight: 900; }
    .pill {
      display: block;
      width: fit-content;
      margin: 12px auto 24px;
      background: var(--night);
      color: #fff;
      font-weight: 900;
      font-size: clamp(26px, 6vw, 36px);
      padding: 8px 38px;
      border-radius: 30px;
    }
    .q {
      display: block;
      margin: 0 0 18px;
    }
    .q span {
      display: block;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 4px;
    }
    .q input {
      width: 100%;
      font: inherit;
      font-size: 17px;
      color: var(--ink);
      background: var(--field);
      border: 0;
      border-bottom: 2px solid var(--line);
      border-radius: 10px 10px 0 0;
      padding: 10px 12px;
    }
    .q.bad input {
      border-bottom-color: #e5484d;
      background: #ffe3e5;
      color: var(--ink);
    }
    .msg {
      text-align: center;
      color: var(--danger);
      font-weight: 700;
      min-height: 24px;
    }
    .send {
      display: block;
      margin: 10px auto 0;
      background: var(--night);
      color: #fff;
      font-size: 20px;
      padding: 14px 44px;
    }
    .send:hover { background: var(--line); }
    .send:disabled {
      opacity: .6;
      cursor: wait;
    }
    #done {
      color: #fff;
      text-align: center;
      gap: 14px;
      flex-direction: column;
    }
    #done h2 {
      font-size: 34px;
      font-weight: 900;
      margin: 6px 0;
    }
    #done p {
      margin: 0;
      color: var(--soft);
      font-size: 18px;
      max-width: 420px;
    }
    #all {
      width: min(640px, 100%);
      display: grid;
      gap: 12px;
      margin-top: 16px;
      text-align: right;
    }
    .card {
      background: var(--paper);
      color: var(--ink);
      border-radius: 20px;
      padding: 16px 20px;
      border-right: 8px solid var(--line);
    }
    .card h3 {
      margin: 0 0 6px;
      font-size: 19px;
    }
    .card p {
      margin: 2px 0;
      font-size: 16px;
    }
    .card p b { color: var(--line); }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }
    @media (max-width: 480px) {
      .paper {
        padding: 26px 18px 34px;
        border-radius: 50px 90px 50px 90px;
      }
      .start {
        flex-direction: column;
      }
      .start button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <section class="view" id="welcome">
    <img class="logo" alt="شعار صناع الأثر" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 240'%3E%3Crect width='240' height='240' rx='42' fill='%231c0a40'/%3E%3Ccircle cx='120' cy='120' r='72' fill='%23f3e8ff'/%3E%3Cpath d='M76 136c12-28 35-42 68-42 17 0 31 4 43 13l-11 18c-9-6-19-9-32-9-22 0-39 11-49 30l-19-10zm48 26c-19 0-34-12-41-31l22-10c4 10 12 16 23 16 11 0 20-7 22-17l17 8c-5 18-19 34-43 34z' fill='%233b1584'/%3E%3C/svg%3E" />
    <h1>لو الدفعة مسلسل</h1>
    <p>اكتب اسمك وابدأ تعبي الاستمارة</p>
    <div class="start">
      <input id="name" type="text" placeholder="اسمك الكامل" autocomplete="name" aria-label="اسمك" />
      <button id="go" type="button">ابدأ</button>
    </div>
    <div class="err" id="nerr" role="alert"></div>
  </section>

  <section class="view" id="formView" hidden>
    <div class="paper">
      <img class="logo" alt="شعار صناع الأثر" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 240'%3E%3Crect width='240' height='240' rx='42' fill='%231c0a40'/%3E%3Ccircle cx='120' cy='120' r='72' fill='%23f3e8ff'/%3E%3Cpath d='M76 136c12-28 35-42 68-42 17 0 31 4 43 13l-11 18c-9-6-19-9-32-9-22 0-39 11-49 30l-19-10zm48 26c-19 0-34-12-41-31l22-10c4 10 12 16 23 16 11 0 20-7 22-17l17 8c-5 18-19 34-43 34z' fill='%233b1584'/%3E%3C/svg%3E" />
      <div class="who">مرحباً <b id="welcomeName">أخي/أختي</b></div>
      <div class="pill">لو الدفعة مسلسل</div>

      <label class="q" for="q1">
        <span>1) ما اسمك الكامل؟</span>
        <input id="q1" type="text" placeholder="اكتب الاسم كاملاً" />
      </label>

      <label class="q" for="q2">
        <span>2) ما اسمك في الدفعة؟</span>
        <input id="q2" type="text" placeholder="اللقب أو الاسم المفضل" />
      </label>

      <label class="q" for="q3">
        <span>3) ما أكثر شيء تحبه في القسم؟</span>
        <input id="q3" type="text" placeholder="اكتب جوابك" />
      </label>

      <div id="msg" class="msg" role="alert"></div>
      <button id="submit" class="send" type="button">تأكيد</button>
    </div>
  </section>

  <section class="view" id="done" hidden>
    <div>
      <h2>تمت الاستمارة بنجاح</h2>
      <p>شكراً لك، تم تسجيل بياناتك في قائمة الدفعة.</p>
    </div>
    <div id="all"></div>
    <div class="row">
      <button id="reset" type="button">ملء نموذج جديد</button>
    </div>
  </section>

  <script>
    const welcome = document.getElementById('welcome');
    const formView = document.getElementById('formView');
    const done = document.getElementById('done');
    const nameInput = document.getElementById('name');
    const go = document.getElementById('go');
    const nerr = document.getElementById('nerr');
    const welcomeName = document.getElementById('welcomeName');
    const q1 = document.getElementById('q1');
    const q2 = document.getElementById('q2');
    const q3 = document.getElementById('q3');
    const submit = document.getElementById('submit');
    const msg = document.getElementById('msg');
    const all = document.getElementById('all');
    const reset = document.getElementById('reset');

    const STORAGE_KEY = 'acc2027-students';
    const readEntries = () => {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    };
    const writeEntries = (entries) => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      } catch {
        // ignore storage errors
      }
    };

    const renderAll = () => {
      const entries = readEntries();
      all.innerHTML = '';
      if (!entries.length) {
        all.innerHTML = '<div class="card"><h3>لا توجد بيانات بعد</h3><p>كن أول من يضيف اسمه إلى قائمة الدفعة.</p></div>';
        return;
      }

      entries.forEach((entry, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3>${index + 1}) ${entry.name || 'غير محدد'}</h3>
          <p><b>اسم الدفعة:</b> ${entry.alias || '—'}</p>
          <p><b>ما يحبه:</b> ${entry.favorite || '—'}</p>
        `;
        all.appendChild(card);
      });
    };

    const clearFieldState = () => {
      q1.parentElement.classList.remove('bad');
      q2.parentElement.classList.remove('bad');
      q3.parentElement.classList.remove('bad');
      msg.textContent = '';
    };

    const validateName = (value) => {
      const name = value.trim();
      if (name.length < 2) {
        nerr.textContent = 'يرجى كتابة اسمك الكامل.';
        return false;
      }
      nerr.textContent = '';
      return true;
    };

    go.addEventListener('click', () => {
      const name = nameInput.value.trim();
      if (!validateName(name)) return;
      welcomeName.textContent = name;
      welcome.hidden = true;
      formView.hidden = false;
      q1.value = name;
      q1.focus();
    });

    submit.addEventListener('click', () => {
      const name = q1.value.trim();
      const alias = q2.value.trim();
      const favorite = q3.value.trim();
      clearFieldState();

      let invalid = false;
      if (name.length < 2) {
        q1.parentElement.classList.add('bad');
        invalid = true;
      }
      if (alias.length < 2) {
        q2.parentElement.classList.add('bad');
        invalid = true;
      }
      if (favorite.length < 2) {
        q3.parentElement.classList.add('bad');
        invalid = true;
      }

      if (invalid) {
        msg.textContent = 'يرجى تعبئة جميع الحقول بشكل صحيح.';
        return;
      }

      submit.disabled = true;
      msg.textContent = 'جارٍ حفظ البيانات...';

      const entries = readEntries();
      entries.push({ name, alias, favorite, createdAt: new Date().toISOString() });
      writeEntries(entries);

      setTimeout(() => {
        formView.hidden = true;
        done.hidden = false;
        renderAll();
        submit.disabled = false;
      }, 400);
    });

    reset.addEventListener('click', () => {
      done.hidden = true;
      formView.hidden = false;
      nameInput.value = '';
      q1.value = '';
      q2.value = '';
      q3.value = '';
      clearFieldState();
      welcome.hidden = false;
      nerr.textContent = '';
      nameInput.focus();
    });

    renderAll();
  </script>
</body>
</html>
